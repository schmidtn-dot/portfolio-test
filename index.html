<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Schmidt</title>
  <meta name="description" content="Selected works by Nick Schmidt — installations and software using synthetic voice, language models and code as an artistic medium.">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="view-home">
  <div class="layout">
    <header class="site-header">
      <div class="site-brand">
        <a href="#home" class="brand-link" id="brand-link">Studio Schmidt</a>
      </div>

      <nav class="project-nav" aria-label="Projects">
        <ul class="project-list" id="project-list">
          <li>
            <a href="#im-so-glad" class="project-link" data-project="im-so-glad">I'm so glad that the days are already getting longer.</a>
          </li>
          <li>
            <a href="#no" class="project-link" data-project="no">NO</a>
          </li>
          <li>
            <a href="#piss-forever" class="project-link" data-project="piss-forever">Piss forever</a>
          </li>
          <li>
            <a href="#iiiii" class="project-link" data-project="iiiii">iiiii-ii-iiiiiiiiiii-iii-i-iiii</a>
          </li>
          <li>
            <a href="#revelation" class="project-link" data-project="revelation">Revelation 9:6</a>
          </li>
          <li>
            <a href="#dsss" class="project-link" data-project="dsss">Department for Speculative Social Software</a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="site-main" id="site-main">
      <!-- Project Description Section (Column 3 on Desktop, stacked on Mobile) -->
      <section class="project-description" id="project-description" aria-live="polite" hidden>
        <div class="description-content" id="description-content"></div>
      </section>

      <!-- Full-bleed Project Media Section -->
      <section class="project-media" id="project-media" hidden>
        <div class="media-figure" id="media-content"></div>
      </section>

      <!-- Legal Content Section (Impressum / Datenschutz) -->
      <section class="legal-section" id="legal-section" aria-live="polite" hidden>
        <div class="legal-content" id="legal-content"></div>
      </section>
    </main>

    <footer class="site-footer" id="site-footer">
      <nav class="legal-nav" aria-label="Legal">
        <span class="lang-toggle"><button type="button" class="lang-btn" data-lang="en">en</button> / <button type="button" class="lang-btn" data-lang="de">de</button></span>
        <a href="mailto:hallo@nickschmidt.de" class="legal-link">hallo@nickschmidt.de</a>
        <a href="#cv" class="legal-link" data-legal="cv">CV</a>
        <a href="#impressum" class="legal-link" data-legal="impressum">Impressum</a>
        <a href="#datenschutz" class="legal-link" data-legal="datenschutz">Datenschutz</a>
      </nav>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
